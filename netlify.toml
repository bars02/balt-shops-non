[build]
  publish = "."
  command = "node build.js"

[build.environment]
  DISABLE_NETLIFY_DRAWER = "true"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
